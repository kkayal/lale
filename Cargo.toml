[workspace]
members = ["lale-lsp", "lale-hub"]
default-members = [".", "lale-lsp"]

[package]
name = "lale"
version = "0.1.3"
edition = "2024"
default-run = "lale"

[lib]
name = "lale"
path = "src/lib.rs"

[[bin]]
name = "lale"
path = "src/main.rs"

[[bin]]
name = "lale-validate"
path = "src/bin/validate.rs"

[dependencies]
colored = "3.0.0"
pest = "2.8.1"
pest_derive = "2.8.1"
clap = { version = "4.5.51", features = ["unicode", "wrap_help", "env"] }
clap_derive = { version = "4.0.0-rc.1" }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
ryu = "1.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Performance"] }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "0.11"

# Optimize the compiler/interpreter a little in dev builds: the test suite
# spawns `lale` hundreds of times, so runtime dominates. Debug assertions and
# overflow checks stay enabled (their defaults are unchanged). Line-tables-only
# debug info keeps file:line backtraces while trimming compile/link time.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
